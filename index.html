<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <script src="./coi-serviceworker.js"></script>
    <title>Geometry Dash Engine</title>
    <style>
      body { background-color: #222; color: white; margin: 0; overflow: hidden; }
      canvas.emscripten { border: 0px none; background-color: black; width: 800px; height: 600px; display: block; margin: 20px auto; }
      #status { text-align: center; font-weight: bold; padding: 10px; }
    </style>
  </head>
  <body>
    <div id="status">Downloading Game Files...</div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var Module = {
        // FIX 1: Locate the WASM file
        locateFile: function(path) { return "./" + path; },
        
        // FIX 2: Force the engine to stay open
        noExitRuntime: true,
        
        // FIX 3: Point specifically to the capitalized Resources folder
        preRun: [function() {
            if (typeof ENV !== 'undefined') {
                ENV.RESOURCES_PATH = "./Resources";
            }
        }],
        
        canvas: document.getElementById('canvas'),
        setStatus: function(text) { statusElement.innerHTML = text; }
      };
    </script>
    <script async type="text/javascript" src="./index.js"></script>
  </body>
</html>
