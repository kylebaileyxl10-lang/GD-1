<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <script src="./coi-serviceworker.js"></script>
    <title>Geometry Dash Engine - Emscripten</title>
    <style>
      body { font-family: arial; margin: 0; padding: 0; background-color: #222; color: white; }
      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      div.emscripten { text-align: center; padding: 10px; }
      div.emscripten_border { border: 2px solid #444; background-color: black; width: fit-content; margin: 20px auto; }
      canvas.emscripten { border: 0px none; background-color: black; width: 800px; height: 600px; }
      #status { font-weight: bold; color: #bbb; }
      #progress { height: 20px; width: 300px; }
      #output { width: 80%; height: 150px; margin: 20px auto; display: block; background-color: black; color: #00ff00; font-family: monospace; }
      .spinner { height: 30px; width: 30px; margin: 0 auto; border: 5px solid #eee; border-top: 5px solid #555; border-radius: 50%; animation: rotation .8s linear infinite; }
      @keyframes rotation { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }
    </style>
  </head>
  <body>
    <div class="emscripten" id="status">Preparing Engine...</div>
    <div class="spinner" id='spinner'></div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>  
    </div>

    <div class="emscripten_border">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>

    <textarea id="output" readonly></textarea>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');

      var Module = {
        // FIX 1: This ensures index.wasm is found in the current folder
        locateFile: function(path) {
          return "./" + path;
        },
        // FIX 2: This forces the engine to look for the "Resources" folder RELATIVELY
        preRun: [function() {
            if (typeof ENV !== 'undefined') {
                ENV.RESOURCES_PATH = "./Resources";
            }
        }],
        print: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.log(text);
          if (outputElement) {
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.style.display = 'none';
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing Assets... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All assets loaded.');
        }
      };
      Module.setStatus('Downloading Game Data...');
      window.onerror = function() {
        Module.setStatus('Engine Error: Check Console');
        spinnerElement.style.display = 'none';
      };
    </script>
    <script async type="text/javascript" src="./index.js"></script>
  </body>
</html>
